<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sheets Video Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf8f3;
    --paper: #fdfcf9;
    --ink: #16202e;
    --blue: #34608a;
    --muted: #5b6673;
    --line: #cdd1d4;
    --warn: #9a3a26;
    --serif: "Instrument Serif", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    --sans: "Geist", "Segoe UI", system-ui, sans-serif;
    --mono: "Geist Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100svh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    overflow-x: hidden;
  }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  .top {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 24px clamp(20px, 3.4vw, 58px);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 22px; font-size: clamp(1.05rem, 1.35vw, 1.4rem); letter-spacing: -0.01em; }
  .brand svg { width: 70px; height: 34px; flex: none; }
  .route { font-family: var(--mono); font-size: clamp(0.72rem, 0.95vw, 0.95rem); letter-spacing: 0.2em; color: var(--muted); white-space: nowrap; }

  .hero { position: relative; display: grid; place-items: center; padding: clamp(40px, 8vh, 84px) 20px 40px; }
  #flow { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  /* narrower than the window on mid-size screens, so the dot flow has room on both sides */
  .stack { position: relative; z-index: 1; width: 100%; max-width: min(906px, max(56vw, 520px)); display: flex; flex-direction: column; align-items: center; text-align: center; }
  .stack > * { animation: rise 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) both; animation-delay: calc(var(--i, 0) * 90ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }

  .pill {
    display: inline-flex; align-items: center; gap: 14px; margin: 0;
    padding: 10px 24px; border: 1px solid var(--line); border-radius: 999px;
    font-family: var(--mono); font-size: clamp(0.78rem, 1vw, 0.98rem); color: #3f4a57; background: color-mix(in srgb, var(--paper) 70%, transparent);
  }
  .pill i { width: 9px; height: 9px; border-radius: 50%; background: var(--blue); }

  h1 {
    margin: clamp(26px, 4.6vh, 46px) 0 0;
    font-family: var(--serif); font-weight: 400;
    font-size: clamp(3.3rem, 7.7vw, 8.1rem); line-height: 0.97; letter-spacing: -0.022em;
    text-wrap: balance;
  }
  h1 em { color: var(--blue); }
  .lede { margin: clamp(22px, 4vh, 40px) 0 0; font-size: clamp(1.1rem, 1.75vw, 1.78rem); color: #4c5764; letter-spacing: 0.005em; }

  .field {
    display: flex; align-items: center; gap: 16px; width: 100%;
    margin-top: clamp(30px, 6.4vh, 62px); padding: 16px 16px 16px 30px;
    background: var(--paper); border: 1px solid #b7bdc4; border-radius: 22px;
    box-shadow: 0 22px 44px -26px rgba(22, 32, 46, 0.32), 0 1px 0 rgba(255, 255, 255, 0.9) inset;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .field:focus-within { border-color: var(--blue); box-shadow: 0 22px 44px -26px rgba(22, 32, 46, 0.32), 0 0 0 4px rgba(52, 96, 138, 0.14); }
  .field > svg { width: 34px; height: 34px; flex: none; color: #52708c; }
  .field input {
    flex: 1; min-width: 0; padding: 10px 6px; border: 0; outline: 0; background: none;
    font: inherit; font-size: clamp(1rem, 1.4vw, 1.4rem); color: var(--ink);
  }
  .field input::placeholder { color: #5f6a76; opacity: 1; }
  button, .button {
    display: inline-flex; align-items: center; justify-content: center; gap: 14px; flex: none;
    padding: 18px 32px; border: 0; border-radius: 14px; cursor: pointer;
    background: var(--ink); color: #fff; text-decoration: none;
    font: inherit; font-weight: 500; font-size: clamp(1rem, 1.35vw, 1.36rem);
    transition: transform 0.15s, background 0.2s;
  }
  button:hover, .button:hover { background: #22364c; }
  button:active, .button:active { transform: translateY(1px); }
  button:hover .arrow, .button:hover .arrow { transform: translateX(4px); }
  .arrow { transition: transform 0.2s; }
  button[disabled] { cursor: progress; background: #3a4654; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
  .field input:focus-visible { outline: 0; }

  .caption {
    margin: clamp(28px, 5vh, 46px) 0 0; min-height: 1.4em;
    font-family: var(--mono); font-size: clamp(0.74rem, 0.95vw, 0.95rem); letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted);
  }
  .caption.error { font-family: var(--sans); font-size: 1.05rem; letter-spacing: 0; text-transform: none; color: var(--warn); }

  .result {
    width: 100%; margin-top: 36px; overflow: hidden; text-align: left;
    background: var(--paper); border: 1px solid #b7bdc4; border-radius: 22px;
    box-shadow: 0 30px 60px -34px rgba(22, 32, 46, 0.4);
  }
  .result[hidden] { display: none; }
  .result video, .result img { display: block; width: 100%; max-height: 62vh; background: #0f1722; object-fit: contain; }
  .meta { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 20px 20px 20px 26px; flex-wrap: wrap; }
  .meta h2 { margin: 0; font-size: 1.15rem; font-weight: 500; overflow-wrap: anywhere; }
  .meta p { margin: 8px 0 0; font-family: var(--mono); font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .meta .ok { color: #2f6b4f; }
  .meta .button { padding: 14px 24px; font-size: 1.05rem; }

  [hidden] { display: none !important; }
  .modes {
    display: inline-flex; gap: 4px; margin-top: clamp(22px, 3.6vh, 34px); padding: 4px;
    border: 1px solid var(--line); border-radius: 999px; background: color-mix(in srgb, var(--paper) 80%, transparent);
  }
  .modes button {
    padding: 8px 20px; border-radius: 999px; background: none; color: var(--muted);
    font-family: var(--mono); font-size: 0.82rem; font-weight: 400; letter-spacing: 0.16em; text-transform: uppercase;
  }
  .modes button:hover { background: rgba(52, 96, 138, 0.08); color: var(--ink); }
  .modes button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .modes button[disabled] { cursor: progress; }
  .field[data-drop] { border-color: var(--blue); border-style: dashed; }
  .field .pick {
    display: flex; align-items: center; gap: 16px; flex: 1; min-width: 0; align-self: stretch;
    margin-left: -14px; padding: 6px 6px 6px 14px; border-radius: 12px; cursor: pointer;
    color: #5f6a76; font-size: clamp(1rem, 1.4vw, 1.4rem);
  }
  .field .pick svg { width: 34px; height: 34px; flex: none; color: #52708c; }
  .field .pick span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .field .pick:hover { background: rgba(52, 96, 138, 0.06); color: var(--ink); }
  .field .pick.chosen { color: var(--ink); }
  #file:focus-visible + .pick { outline: 2px solid var(--blue); outline-offset: 3px; }
  .share { display: inline-flex; align-items: center; gap: 10px; margin: 20px 0 0; font-size: 1rem; color: #3f4a57; cursor: pointer; }
  .share input { width: 18px; height: 18px; margin: 0; accent-color: var(--ink); }
  .meta .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .ghost { padding: 14px 22px; background: none; color: var(--ink); border: 1px solid #b7bdc4; font-size: 1.05rem; }
  .ghost:hover { background: rgba(52, 96, 138, 0.08); }
  .meta .link-line { margin: 10px 0 0; font-family: var(--sans); font-size: 0.95rem; letter-spacing: 0; text-transform: none; overflow-wrap: anywhere; }
  .link-line a { color: var(--blue); }

  footer { padding: 26px 20px 44px; text-align: center; font-family: var(--mono); font-size: 0.9rem; letter-spacing: 0.12em; color: var(--muted); }

  @media (max-width: 600px) {
    .brand svg { width: 52px; height: 26px; }
    .brand { gap: 12px; }
    .field { flex-wrap: wrap; padding: 14px; border-radius: 18px; }
    .field > svg, .field .pick svg { width: 26px; height: 26px; margin-left: 6px; }
    .field .pick { margin-left: 0; padding-left: 0; }
    .field button { width: 100%; }
    .caption { letter-spacing: 0.14em; }
    .meta .button { width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .stack > * { animation: none; }
    * { transition: none !important; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 70 34" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
      <rect x="1" y="1" width="68" height="32" rx="4"/>
      <path d="M13 9.5v15l12-7.5z" stroke-linejoin="round"/>
      <path d="M34 5v24h31V5zM34 13h31M34 21h31M44.3 5v24M54.6 5v24" stroke-width="1.3"/>
    </svg>
    <span>Sheets Video Store</span>
  </div>
  <span class="route" id="route">SHEETS &rarr; VIDEO</span>
</header>

<main class="hero">
  <canvas id="flow" aria-hidden="true"></canvas>
  <div class="stack">
    <p class="pill" style="--i:0"><i></i><span id="pill-text">A simpler way to get video back</span></p>
    <h1 style="--i:1">Your video.<br><em>One link</em> away.</h1>
    <p class="lede" id="lede" style="--i:2">Paste a Google Sheets link to restore it.</p>
    <div class="modes" role="group" aria-label="What to do" style="--i:3">
      <button type="button" data-mode="restore" aria-pressed="true">Restore</button>
      <button type="button" data-mode="upload" aria-pressed="false">Upload</button>
    </div>
    <form class="field" id="form" style="--i:4">
      <svg id="icon-link" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
        <path d="M10.2 13.8a4 4 0 0 0 5.7 0l3.3-3.3a4 4 0 0 0-5.7-5.7l-1.2 1.2"/>
        <path d="M13.8 10.2a4 4 0 0 0-5.7 0l-3.3 3.3a4 4 0 0 0 5.7 5.7l1.2-1.2"/>
      </svg>
      <label class="sr-only" for="link">Google Sheets link</label>
      <input id="link" type="text" inputmode="url" autocomplete="off" spellcheck="false" placeholder="Paste your Google Sheets link here&hellip;">
      <!-- a label for the file input opens the system file picker natively; a scripted click on a hidden input does not in every browser -->
      <input id="file" type="file" accept="video/*,image/*" class="sr-only">
      <label class="pick" id="pick" for="file" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 15V4M7.5 8.5 12 4l4.5 4.5"/>
          <path d="M4 14v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/>
        </svg>
        <span id="pick-text">Click to choose a video or image from your computer&hellip;</span>
      </label>
      <button id="go" type="submit"><span id="go-label">Restore</span><span class="arrow" aria-hidden="true">&rarr;</span></button>
    </form>
    <label class="share" id="share-row" hidden><input type="checkbox" id="share" checked> Anyone with the link can restore it</label>
    <p class="caption" id="status" role="status" style="--i:5">Paste a link. We&rsquo;ll take it from here.</p>
    <section class="result" id="sent" aria-label="Uploaded file" hidden>
      <div class="meta">
        <div>
          <h2 id="sent-name"></h2>
          <p id="sent-facts"></p>
          <p class="link-line"><a id="sent-link" target="_blank" rel="noopener"></a></p>
        </div>
        <div class="actions">
          <button type="button" class="button" id="copy">Copy link</button>
          <button type="button" class="ghost" id="try">Restore it <span class="arrow" aria-hidden="true">&rarr;</span></button>
        </div>
      </div>
    </section>
    <section class="result" id="result" aria-label="Restored file" hidden>
      <div id="media"></div>
      <div class="meta">
        <div>
          <h2 id="name"></h2>
          <p id="facts"></p>
        </div>
        <a class="button" id="save">Download <span class="arrow" aria-hidden="true">&darr;</span></a>
      </div>
    </section>
  </div>
</main>

<footer>Sheets Video Store</footer>

<script>
(() => {
  // ---------- flow: dotted curves pour from both edges into the link box ----------
  const canvas = document.getElementById('flow'), ctx = canvas.getContext('2d');
  const hero = document.querySelector('.hero'), form = document.getElementById('form');
  const still = matchMedia('(prefers-reduced-motion: reduce)');
  const LINE = 'rgba(40, 64, 92, 0.4)', MOTE = 'rgba(40, 64, 92, 0.75)', SHAPE_INK = 'rgba(52, 92, 128, 0.95)', PAPER = '250, 248, 243';
  let W = 0, H = 0, sides = [], paths = [], booms = [], pace = 1, targetPace = 1, last = 0;

  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

  // play triangle and sheet grid, both as dot lattices around (0, 0)
  function trianglePoints() {
    const pts = [], w = 84, h = 98, s = 5.2;
    for (let y = -h / 2; y <= h / 2; y += s)
      for (let x = -w / 2; x <= w / 2; x += s)
        if (Math.abs(y) <= (h / 2) * (1 - (x + w / 2) / w) + 0.01) pts.push([x, y]);
    return pts;
  }
  function gridPoints() {
    const pts = [], w = 114, h = 88, s = 4;
    const xs = [-w / 2, -w / 6, w / 6, w / 2], ys = [-h / 2, -h / 6, h / 6, h / 2];
    for (const y of ys) for (let x = -w / 2; x <= w / 2; x += s) pts.push([x, y]);
    for (const x of xs) for (let y = -h / 2 + s; y < h / 2; y += s) if (!ys.some(v => Math.abs(v - y) < s / 2)) pts.push([x, y]);
    return pts;
  }
  // pair every dot of one shape with a dot of the other, row by row, so the morph stays tidy
  const SHAPE = (() => {
    const byRow = (p, q) => p[1] - q[1] || p[0] - q[0];
    const a = trianglePoints().sort(byRow), b = gridPoints().sort(byRow), n = Math.max(a.length, b.length);
    return Array.from({ length: n }, (_, i) => {
      const p = a[Math.floor(i * a.length / n)], q = b[Math.floor(i * b.length / n)], turn = Math.random() * 6.283;
      return { ax: p[0], ay: p[1], bx: q[0], by: q[1], delay: 0.55 * i / n + 0.45 * Math.random(), jx: Math.cos(turn), jy: Math.sin(turn) };
    });
  })();

  // Gateway Flow, light mode: 80 dotted cubic curves, alternating sides, one mote riding each.
  // Changed from the original: the curves end just inside the link box instead of at the screen centre.
  const PATHS = 80;
  function makePaths(old, centre) {
    return Array.from({ length: PATHS }, (_, i) => {
      const base = centre + (i / PATHS - 0.5) * H * 1.4, prev = old[i];   // spread evenly around where the curves meet
      return { left: i % 2 === 0, base, startY: base, t: prev ? prev.t : Math.random(),
               speed: prev ? prev.speed : (0.0015 + Math.random() * 0.002) * 60 };   // original speeds were per frame at 60 fps
    });
  }
  // edge -> halfway, still at the start height -> 80%, at the box height -> just inside the box
  function curve(p) {
    const s = p.left ? sides[0] : sides[1], at = f => s.edge + s.dir * s.span * f;
    return [at(0), p.startY, at(0.5), p.startY, at(0.8), s.y, at(1), s.y];
  }
  function bezier(t, c) {
    const u = 1 - t, a = u * u * u, b = 3 * u * u * t, d = 3 * u * t * t, e = t * t * t;
    return [a * c[0] + b * c[2] + d * c[4] + e * c[6], a * c[1] + b * c[3] + d * c[5] + e * c[7]];
  }

  function layout() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2), box = hero.getBoundingClientRect(), f = form.getBoundingClientRect();
    W = box.width; H = box.height;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const left = f.left - box.left, right = box.right - f.right, y = f.top - box.top + f.height / 2;
    const sink = Math.min(48, f.width * 0.08), room = Math.min(left, right), scale = clamp(room / 320, 0.5, 1);
    sides = room < 90 ? [] : [{ edge: 0, dir: 1, span: left + sink }, { edge: W, dir: -1, span: right + sink }];
    for (const s of sides) {
      s.y = y;
      // the shape sits inside the stream, on the fan's axis, a little before halfway
      s.shape = room >= 140 ? { x: s.edge + s.dir * s.span * 0.42, y, scale } : null;
    }
    paths = makePaths(paths, y);
    if (still.matches) draw(0, 0);
  }

  // 0 = triangle, 1 = grid: hold, morph, hold, morph back
  function swap(ms) {
    const p = (ms / 7400) % 1;
    return p < 0.27 ? 0 : p < 0.5 ? (p - 0.27) / 0.23 : p < 0.77 ? 1 : 1 - (p - 0.77) / 0.23;
  }

  function draw(ms, dt) {
    ctx.clearRect(0, 0, W, H);
    if (!sides.length) return;
    for (const b of booms) { b.r += 900 * dt; b.life -= 0.9 * dt; }
    booms = booms.filter(b => b.life > 0);

    ctx.setLineDash([1, 4]); ctx.lineWidth = 1.2; ctx.strokeStyle = LINE;
    for (const p of paths) {
      const c = p.c = curve(p);
      ctx.beginPath(); ctx.moveTo(c[0], c[1]); ctx.bezierCurveTo(c[2], c[3], c[4], c[5], c[6], c[7]); ctx.stroke();
    }
    ctx.setLineDash([]);

    ctx.fillStyle = MOTE;
    for (const p of paths) {
      p.t += p.speed * pace * dt;
      if (p.t > 1) { p.t = 0; p.startY = clamp(p.startY + (Math.random() - 0.5) * 10, p.base - 40, p.base + 40); }
      let [x, y] = bezier(p.t, p.c);
      for (const b of booms) {                              // a click sends out a ring that shoves motes aside
        const dx = x - b.x, dy = y - b.y, dist = Math.hypot(dx, dy) || 1, off = Math.abs(dist - b.r);
        if (off < 120) { const push = (1 - off / 120) * b.life * 80; x += dx / dist * push; y += dy / dist * push; }
      }
      ctx.fillRect(x - 1.5, y - 1.5, 3, 3);
    }

    const morph = swap(ms);
    for (const s of sides) {
      if (!s.shape) continue;
      const { x: cx, y: cy, scale: k } = s.shape, r = 80 * k;
      // clear a soft pocket in the stream so the shape reads as sitting inside it
      const halo = ctx.createRadialGradient(cx, cy, r * 0.4, cx, cy, r);
      halo.addColorStop(0, `rgba(${PAPER}, 0.94)`); halo.addColorStop(1, `rgba(${PAPER}, 0)`);
      ctx.fillStyle = halo; ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
      // left starts as the triangle, right as the grid; they trade places
      const raw = s.dir > 0 ? morph : 1 - morph, dot = 1.3 + 0.8 * k;
      ctx.fillStyle = SHAPE_INK;
      for (const p of SHAPE) {
        const e = ease(clamp(raw * 1.5 - p.delay * 0.5, 0, 1)), drift = Math.sin(Math.PI * e) * 9;
        ctx.fillRect(cx + (p.ax + (p.bx - p.ax) * e + p.jx * drift) * k - dot / 2,
                     cy + (p.ay + (p.by - p.ay) * e + p.jy * drift) * k - dot / 2, dot, dot);
      }
    }
  }

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    pace += (targetPace - pace) * Math.min(1, dt * 3);
    draw(now, dt);
    if (!still.matches) requestAnimationFrame(frame);
  }
  new ResizeObserver(layout).observe(hero);
  layout();
  const start = () => { last = performance.now(); still.matches ? draw(0, 0) : requestAnimationFrame(frame); };
  still.addEventListener('change', start);
  start();
  hero.addEventListener('pointerdown', event => {
    if (still.matches || event.target.closest('form, .result')) return;
    const r = canvas.getBoundingClientRect();
    booms.push({ x: event.clientX - r.left, y: event.clientY - r.top, r: 0, life: 1 });
  });

  // ---------- restore ----------
  const input = document.getElementById('link'), go = document.getElementById('go'), goLabel = document.getElementById('go-label');
  const status = document.getElementById('status'), result = document.getElementById('result'), media = document.getElementById('media');
  const save = document.getElementById('save');
  const modeButtons = [...document.querySelectorAll('.modes button')];
  let objectUrl = null, ticker = 0, done = '', mode = 'restore';

  function say(text, isError) { status.textContent = text; status.classList.toggle('error', !!isError); }
  function busy(on) {
    const up = mode === 'upload';
    go.disabled = on; goLabel.textContent = on ? (up ? 'Uploading' : 'Restoring') : (up ? 'Upload' : 'Restore');
    for (const button of modeButtons) button.disabled = on;
    targetPace = on ? 4 : 1; done = '';
    clearInterval(ticker);
    if (on) {
      const began = Date.now(), what = up ? 'Uploading to Google Sheets' : 'Restoring from Google Sheets';
      ticker = setInterval(() => say(`${what}${done} · ${Math.round((Date.now() - began) / 1000)} s`), 1000);
    }
  }
  const hex = buffer => [...new Uint8Array(buffer)].map(b => b.toString(16).padStart(2, '0')).join('');

  // Two ways to read a sheet. On this computer (python web.py) the local server reads it with the owner's sign-in.
  // Hosted, the browser reads a sheet shared as "anyone with the link" straight from Google with a public API key.
  const LOCAL = ['127.0.0.1', 'localhost'].includes(location.hostname);
  const API_KEY = 'AIzaSyC8xLVjqbHoC66LFp6Y046lEPdi1dgorUc';   // browser key, locked to the Sheets API and this site's address, so it is safe to ship in the page
  const META_KEYS = ['filename', 'mime_type', 'byte_size', 'chunk_count', 'sha256'];
  const ROWS_PER_CALL = 100;   // about 4 MB per response, well inside 60 reads a minute even at 100 MB
  const backoff = attempt => new Promise(wake => setTimeout(wake, Math.min(32000, 1000 * 2 ** attempt) + Math.random() * 1000));

  function sheetIdFrom(text) {
    const match = text.match(/\/spreadsheets\/d\/([\w-]+)/);
    if (match) return match[1];
    if (/^[\w-]{20,}$/.test(text)) return text;
    throw new Error('That does not look like a Google Sheets link.');
  }

  async function sheetGet(id, range) {
    const url = `https://sheets.googleapis.com/v4/spreadsheets/${encodeURIComponent(id)}/values/${encodeURIComponent(range)}`
              + `?valueRenderOption=UNFORMATTED_VALUE&key=${API_KEY}`;
    for (let attempt = 0; ; attempt++) {
      const response = await fetch(url);
      if (response.ok) return (await response.json()).values || [];
      if ((response.status === 429 || response.status >= 500) && attempt < 6) { await backoff(attempt); continue; }   // Google asks for backoff on quota errors
      const detail = String((await response.json().catch(() => ({}))).error?.message || '');
      if (response.status === 403 && /caller does not have permission/i.test(detail))   // a blocked site says "Permission denied on the service"
        throw new Error('This sheet is not shared. In Google Sheets choose Share, then General access: Anyone with the link, Viewer.');
      if (response.status === 404) throw new Error('No spreadsheet found at that link.');
      if (/Unable to parse range/i.test(detail)) throw new Error('That spreadsheet was not made by Sheets Video Store.');
      throw new Error(`Google Sheets answered ${response.status}${detail ? ': ' + detail : ''}.`);
    }
  }

  // each 40,000-character chunk is whole Base64 groups, so chunks decode one at a time
  function decodeChunk(text, n) {
    if (text.length % 4 || !/^[A-Za-z0-9+/]*={0,2}$/.test(text)) throw new Error(`Chunk ${n} is not valid Base64.`);
    const binary = atob(text), out = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) out[i] = binary.charCodeAt(i);
    return out;
  }

  // the same checks as assemble() in sheetvid.py
  async function readPublicSheet(link) {
    if (!API_KEY) throw new Error('This site has no Google API key configured yet.');
    const id = sheetIdFrom(link);
    const meta = Object.fromEntries((await sheetGet(id, 'meta!A1:B5')).filter(row => row.length === 2));
    const absent = META_KEYS.filter(key => meta[key] === undefined || meta[key] === '');
    if (absent.length) throw new Error(`No complete upload found (meta is missing: ${absent.join(', ')}).`);
    const count = Number(meta.chunk_count), size = Number(meta.byte_size);
    if (!Number.isInteger(count) || !Number.isInteger(size) || count < 1 || size > 150e6)
      throw new Error('The sheet is corrupt: chunk_count and byte_size must be sensible whole numbers.');

    const last = (await sheetGet(id, 'chunks!A2:A')).length + 1;   // sheet row of the last numbered chunk
    const pieces = new Map();
    for (let start = 2; start <= last; start += ROWS_PER_CALL) {
      for (const row of await sheetGet(id, `chunks!A${start}:B${Math.min(start + ROWS_PER_CALL - 1, last)}`)) {
        if (!row.some(cell => cell !== '')) continue;
        const n = row[0];
        if (typeof n !== 'number' || !Number.isInteger(n)) throw new Error(`Invalid chunk number: ${JSON.stringify(n)}.`);
        if (pieces.has(n)) throw new Error(`Duplicate chunk ${n}.`);
        if (typeof row[1] !== 'string' || !row[1]) throw new Error(`Chunk ${n} has no data.`);
        pieces.set(n, decodeChunk(row[1], n));
      }
      done = ` · ${Math.min(100, Math.round(100 * (start + ROWS_PER_CALL - 2) / Math.max(1, last - 1)))}%`;
    }
    const missing = [], extra = [...pieces.keys()].filter(n => n < 1 || n > count).sort((a, b) => a - b);
    for (let n = 1; n <= count; n++) if (!pieces.has(n)) missing.push(n);
    if (missing.length) throw new Error(`Missing chunks (${missing.length} of ${count}): ${missing.slice(0, 10).join(', ')}.`);
    if (extra.length) throw new Error(`Unexpected chunks beyond ${count}: ${extra.slice(0, 10).join(', ')}.`);

    let total = 0;
    for (let n = 1; n <= count; n++) total += pieces.get(n).length;
    if (total !== size) throw new Error(`Size mismatch: restored ${total} bytes, expected ${size}.`);
    const bytes = new Uint8Array(total);
    for (let n = 1, at = 0; n <= count; at += pieces.get(n).length, n++) bytes.set(pieces.get(n), at);
    return { bytes: bytes.buffer, name: String(meta.filename).split(/[\\/]/).pop(), mime: String(meta.mime_type),
             expected: String(meta.sha256), chunks: count };
  }

  async function readLocal(link) {
    const response = await fetch('/api/restore', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sheet: link }) });
    if (!response.ok) throw new Error((await response.json().catch(() => ({}))).error || `The server answered ${response.status}`);
    const header = key => decodeURIComponent(response.headers.get('X-Sheetvid-' + key) || '');
    return { bytes: await response.arrayBuffer(), name: header('Name'), mime: header('Mime'), expected: header('Sha256'), chunks: header('Chunks') };
  }

  // ---------- upload: the visitor signs in with their own Google account, and the file goes into their own Drive ----------
  const CLIENT_ID = '823029525535-7kf4gjnmml0jlq6g3646dodolvp9sfdn.apps.googleusercontent.com';
  const SCOPE = 'https://www.googleapis.com/auth/drive.file';   // only files this site creates; nothing else in their Drive
  const MAX_BYTES = 100e6, BYTES_PER_CHUNK = 30000, ROWS_PER_WRITE = 25;   // as sheetvid.py: 40,000 characters a cell, ~1 MB a call
  const fileInput = document.getElementById('file'), pick = document.getElementById('pick'), shareRow = document.getElementById('share-row');
  const sent = document.getElementById('sent'), sentLink = document.getElementById('sent-link');
  let chosen = null, gis = null, tokenClient = null, pending = null, token = null;

  const COPY = {
    restore: { route: 'SHEETS → VIDEO', pill: 'A simpler way to get video back', lede: 'Paste a Google Sheets link to restore it.', go: 'Restore',
               hint: LOCAL ? 'Paste a link. We’ll take it from here.' : 'The sheet must be shared: anyone with the link.' },
    upload:  { route: 'VIDEO → SHEETS', pill: 'A simpler way to save video', lede: 'Store a video or image in your own Google Sheets.', go: 'Upload',
               hint: 'Sign in with your own Google account. The file stays in your Drive.' },
  };
  function setMode(next) {
    mode = next;
    const up = mode === 'upload', copy = COPY[mode];
    for (const button of modeButtons) button.setAttribute('aria-pressed', String(button.dataset.mode === mode));
    document.getElementById('route').textContent = copy.route;
    document.getElementById('pill-text').textContent = copy.pill;
    document.getElementById('lede').textContent = copy.lede;
    goLabel.textContent = copy.go;
    input.hidden = up; pick.hidden = !up; shareRow.hidden = !up;
    document.getElementById('icon-link').toggleAttribute('hidden', up);   // SVG elements have no .hidden property
    result.hidden = true; sent.hidden = true;
    say(copy.hint);
    if (up) loadGis().catch(error => say(error.message, true));
  }
  for (const button of modeButtons) button.addEventListener('click', () => setMode(button.dataset.mode));

  function choose(file) {
    chosen = file || null;
    document.getElementById('pick-text').textContent = chosen
      ? `${chosen.name} · ${(chosen.size / 1e6).toFixed(chosen.size < 1e6 ? 2 : 1)} MB · click to change`
      : 'Click to choose a video or image from your computer…';
    pick.classList.toggle('chosen', !!chosen);
  }
  fileInput.addEventListener('change', () => choose(fileInput.files[0]));
  form.addEventListener('dragover', event => { if (mode !== 'upload') return; event.preventDefault(); form.dataset.drop = ''; });
  form.addEventListener('dragleave', () => delete form.dataset.drop);
  form.addEventListener('drop', event => {
    if (mode !== 'upload') return;
    event.preventDefault(); delete form.dataset.drop; choose(event.dataTransfer.files[0]);
  });

  function loadGis() {
    gis = gis || new Promise((ok, fail) => {
      const script = Object.assign(document.createElement('script'), { src: 'https://accounts.google.com/gsi/client', async: true });
      script.onload = ok;
      script.onerror = () => { gis = null; fail(new Error('Could not load Google sign-in. Check the connection and try again.')); };
      document.head.append(script);
    });
    return gis;
  }

  // must start inside the click itself, or the browser blocks Google's sign-in window
  function signIn() {
    if (token && token.expires > Date.now() + 60000) return Promise.resolve(token.value);
    const oauth = window.google?.accounts?.oauth2;
    if (!oauth) return Promise.reject(new Error('Google sign-in is still loading. Try again in a moment.'));
    tokenClient = tokenClient || oauth.initTokenClient({
      client_id: CLIENT_ID, scope: SCOPE,
      callback: reply => {
        if (reply.error || !oauth.hasGrantedAllScopes(reply, SCOPE)) return pending.fail(new Error('Google did not give this site access, so nothing was uploaded.'));
        token = { value: reply.access_token, expires: Date.now() + Number(reply.expires_in) * 1000 };
        pending.ok(token.value);
      },
      error_callback: problem => pending.fail(new Error(
        problem.type === 'popup_closed' ? 'The Google sign-in window was closed, so nothing was uploaded.'
        : problem.type === 'popup_failed_to_open' ? 'The browser blocked the Google sign-in window. Allow pop-ups for this site and try again.'
        : 'Google sign-in failed, so nothing was uploaded.')),
    });
    return new Promise((ok, fail) => { pending = { ok, fail }; tokenClient.requestAccessToken(); });
  }

  async function googleCall(method, url, body, accessToken) {
    for (let attempt = 0; ; attempt++) {
      const response = await fetch(url, { method, headers: { Authorization: `Bearer ${accessToken}`, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      if (response.ok) return response.json();
      if ((response.status === 429 || response.status >= 500) && attempt < 6) { await backoff(attempt); continue; }
      if (response.status === 401) { token = null; throw new Error('Your Google sign-in expired. Press Upload again to sign in.'); }
      const detail = String((await response.json().catch(() => ({}))).error?.message || '');
      throw new Error(`Google answered ${response.status}${detail ? ': ' + detail : ''}.`);
    }
  }

  function encodeChunk(part) {
    let binary = '';
    for (let i = 0; i < part.length; i += 0x8000) binary += String.fromCharCode.apply(null, part.subarray(i, i + 0x8000));
    return btoa(binary);
  }

  // same order as upload() in sheetvid.py: chunks first and meta last, so a cut-off upload is never taken for a whole one
  async function uploadFile(file, share, accessToken) {
    const bytes = new Uint8Array(await file.arrayBuffer());
    const sha256 = hex(await crypto.subtle.digest('SHA-256', bytes));
    const rows = [['chunk', 'data']];
    for (let at = 0; at < bytes.length; at += BYTES_PER_CHUNK) rows.push([rows.length, encodeChunk(bytes.subarray(at, at + BYTES_PER_CHUNK))]);
    const sheets = 'https://sheets.googleapis.com/v4/spreadsheets';
    const { spreadsheetId: id } = await googleCall('POST', sheets, {
      properties: { title: `sheetvid - ${file.name}` },
      sheets: [{ properties: { title: 'meta' } }, { properties: { title: 'chunks', gridProperties: { rowCount: Math.max(1000, rows.length) } } }],
    }, accessToken);
    // RAW: Sheets must never read a chunk starting with + or = as a formula
    const write = (cell, values) => googleCall('PUT', `${sheets}/${id}/values/${encodeURIComponent(cell)}?valueInputOption=RAW`, { values }, accessToken);
    for (let start = 0; start < rows.length; start += ROWS_PER_WRITE) {
      await write(`chunks!A${start + 1}`, rows.slice(start, start + ROWS_PER_WRITE));
      done = ` · ${Math.round(100 * Math.min(rows.length, start + ROWS_PER_WRITE) / rows.length)}%`;
    }
    await write('meta!A1', [['filename', file.name], ['mime_type', file.type || 'application/octet-stream'],
                            ['byte_size', bytes.length], ['chunk_count', rows.length - 1], ['sha256', sha256]]);
    let shareError = '';
    if (share) {
      try { await googleCall('POST', `https://www.googleapis.com/drive/v3/files/${id}/permissions`, { type: 'anyone', role: 'reader' }, accessToken); }
      catch (error) { shareError = error.message; }
    }
    return { id, size: bytes.length, count: rows.length - 1, shared: share && !shareError, shareError };
  }

  function startUpload() {
    if (!chosen) return say('Choose a video or image first.', true);
    if (!chosen.size) return say('That file is empty.', true);
    if (chosen.size > MAX_BYTES)
      return say(`That file is ${(chosen.size / 1e6).toFixed(1)} MB. The limit is 100 MB, because a Google spreadsheet fills up at about 110 MB.`, true);
    const file = chosen, share = document.getElementById('share').checked;
    const access = signIn();   // before any await, so the sign-in window counts as part of this click
    busy(true); say('Waiting for Google sign-in');
    (async () => {
      try {
        const upload = await uploadFile(file, share, await access);
        const link = `https://docs.google.com/spreadsheets/d/${upload.id}`;
        document.getElementById('sent-name').textContent = file.name;
        document.getElementById('sent-facts').textContent =
          `${upload.size.toLocaleString()} bytes · ${upload.count} chunks · ${upload.shared ? 'anyone with the link' : 'private to you'}`;
        sentLink.href = link; sentLink.textContent = link;
        sent.hidden = false;
        say(upload.shareError ? `Uploaded, but sharing failed: ${upload.shareError}`
            : upload.shared ? 'Uploaded. Send the link to anyone.' : 'Uploaded. The sheet is private to you.', !!upload.shareError);
        sent.scrollIntoView({ behavior: still.matches ? 'auto' : 'smooth', block: 'nearest' });
      } catch (error) {
        say(error.message || 'Something went wrong.', true);
      } finally {
        busy(false);
      }
    })();
  }

  document.getElementById('copy').addEventListener('click', async event => {
    const button = event.currentTarget;
    try { await navigator.clipboard.writeText(sentLink.href); button.textContent = 'Copied'; }
    catch { button.textContent = 'Copy failed'; }
    setTimeout(() => { button.textContent = 'Copy link'; }, 1600);
  });
  document.getElementById('try').addEventListener('click', () => {
    const link = sentLink.href;
    setMode('restore'); input.value = link; form.requestSubmit();
  });
  setMode('restore');

  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (go.disabled) return;
    if (mode === 'upload') return startUpload();
    const link = input.value.trim();
    if (!link) return say('Paste a Google Sheets link first.', true);
    busy(true); say('Restoring from Google Sheets');
    try {
      const file = await (LOCAL ? readLocal(link) : readPublicSheet(link));
      const { bytes, mime, expected } = file, name = file.name || 'restored';
      if (hex(await crypto.subtle.digest('SHA-256', bytes)) !== expected) throw new Error('The file arrived damaged: its SHA-256 does not match the one stored in the sheet.');

      const kind = mime.startsWith('video/') ? 'video' : mime.startsWith('image/') ? 'img' : null;
      if (objectUrl) URL.revokeObjectURL(objectUrl);
      objectUrl = URL.createObjectURL(new Blob([bytes], { type: kind ? mime : 'application/octet-stream' }));
      media.replaceChildren();
      if (kind) {
        const view = document.createElement(kind);
        view.src = objectUrl;
        if (kind === 'video') { view.controls = true; view.playsInline = true; } else view.alt = name;
        media.append(view);
      }
      document.getElementById('name').textContent = name;
      const facts = document.getElementById('facts');
      facts.textContent = `${bytes.byteLength.toLocaleString()} bytes · ${file.chunks} chunks · `;
      const ok = document.createElement('span'); ok.className = 'ok'; ok.textContent = 'SHA-256 verified'; ok.title = expected;
      facts.append(ok);
      save.href = objectUrl; save.download = name;
      result.hidden = false;
      say('Restored. Checked byte for byte.');
      result.scrollIntoView({ behavior: still.matches ? 'auto' : 'smooth', block: 'nearest' });
    } catch (error) {
      say(error.message || 'Something went wrong.', true);
    } finally {
      busy(false);
    }
  });
})();
</script>
</body>
</html>
