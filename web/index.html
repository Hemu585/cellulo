<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Cellulo</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml" sizes="any">
<link rel="icon" href="icon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="hero-poster.webp" as="image" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000;
    --ink: #fff;
    --soft: rgba(255, 255, 255, 0.8);
    --muted: rgba(255, 255, 255, 0.62);
    --panel: rgba(8, 8, 12, 0.55);    /* result panels: liquid glass with a dark tint, so long text stays readable */
    --warn: #ffb8a3;
    --sans: "DM Sans", "Segoe UI", system-ui, sans-serif;   /* one family for everything: calm, with a 400/600 weight contrast */
    color-scheme: dark;   /* the page is dark only: native controls and scrollbars match it */
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  @media (pointer: fine) { html { overscroll-behavior: none; } }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    position: relative;
    grid-template-rows: 1fr;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    overflow-x: hidden;
    /* keep content clear of notches and the home indicator (viewport-fit=cover) */
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* liquid glass: almost clear, a soft blur behind, and a hairline rim that is bright at the top and bottom edges */
  .liquid-glass {
    background: rgba(255, 255, 255, 0.01);
    background-blend-mode: luminosity;
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
    border: none;
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
    position: relative;
    overflow: hidden;
  }
  .liquid-glass::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1.4px;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.45) 0%, rgba(255, 255, 255, 0.15) 20%, rgba(255, 255, 255, 0) 40%,
                rgba(255, 255, 255, 0) 60%, rgba(255, 255, 255, 0.15) 80%, rgba(255, 255, 255, 0.45) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  /* the top bar floats over the page, so the content can sit in the true middle of the screen */
  .top {
    position: absolute; z-index: 2; top: env(safe-area-inset-top); left: env(safe-area-inset-left); right: env(safe-area-inset-right);
    display: flex; align-items: center; justify-content: flex-start;
    padding: clamp(18px, 3.4vh, 36px) clamp(20px, 2.5vw, 44px);
  }
  /* logo + name: the extra padding makes the tap target 44px without moving anything */
  .brand {
    display: inline-flex; align-items: center; gap: 0.42em; margin: -10px -12px; padding: 10px 12px; border-radius: 12px;
    font-size: clamp(1.08rem, 1.25vw, 1.3rem); font-weight: 500; letter-spacing: -0.015em; color: var(--ink); text-decoration: none;
  }
  .brand .mark { width: 1.18em; height: 1.18em; flex: none; }
  .brand span { line-height: 1; padding-top: 0.06em; }   /* sits the text on the mark's optical centre */

  /* the clip fills the screen behind everything, anchored at the bottom so the figure stays in view; lvh so no gap shows when a phone's toolbar slides away */
  .backdrop { position: fixed; top: 0; left: 0; z-index: 0; width: 100%; height: 100vh; height: 100lvh; overflow: hidden; pointer-events: none;
    background: var(--bg) url(hero-poster.webp) 50% 100% / cover no-repeat; }   /* the clip's first frame: shows at once, and stays if autoplay is blocked (iOS Low Power Mode, Data Saver) */
  .backdrop video { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 100%; opacity: 0; transition: opacity 0.8s; }
  .backdrop video.on { opacity: 1; }   /* app.js adds this once the first frame is ready */

  /* minmax(0, 1fr): the column follows the screen width, not the longest unbreakable text inside it.
     More room below than above lifts the content into the dark sky, clear of the figure. */
  .hero { position: relative; z-index: 1; display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; padding: clamp(80px, 12vh, 120px) 24px clamp(120px, 36vh, 400px); }
  .stack { position: relative; z-index: 1; width: 100%; max-width: 36rem; container-type: inline-size; display: flex; flex-direction: column; align-items: center; text-align: center; text-shadow: 0 1px 18px rgba(0, 0, 0, 0.5); }
  .stack > * { animation: rise 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) both; animation-delay: calc(var(--i, 0) * 90ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }


  h1 {
    margin: 0; white-space: nowrap;
    font-family: var(--sans); font-weight: 400;
    /* one line exactly as wide as the search pill: the line is 9.09 em long (measured), so 100cqi / 9.18 fills the column, with a hair of room for rounding on phones */
    font-size: min(7.2vw, 4.5rem);   /* older browsers without container units */
    font-size: calc(100cqi / 9.18); line-height: 1.12; letter-spacing: -0.025em;
  }
  h1 em { font-style: normal; font-weight: 600; }

  /* one pill for both jobs: paste a link to restore, or attach a file to upload */
  .search {
    display: flex; align-items: center; gap: 10px; width: 100%;
    margin-top: clamp(20px, 3.6vh, 36px); padding: 8px; border-radius: 999px; text-shadow: none;
    background-color: rgba(0, 0, 0, 0.38);   /* smoked glass: the glowing stream rises behind the pill near the end of the clip */
  }
  .search:focus-within { box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1), 0 0 0 3px rgba(255, 255, 255, 0.22); }
  .search[data-drop] { box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1), 0 0 0 2px rgba(255, 255, 255, 0.6); }
  .search input[type="text"] {
    flex: 1; min-width: 0; height: 44px; padding: 0 4px; border: 0; outline: 0; background: none;
    font: inherit; font-size: 1rem; color: var(--ink);
  }
  .search input[type="text"]::placeholder { color: rgba(255, 255, 255, 0.6); opacity: 1; }
  .search input[type="text"]:focus-visible { outline: 0; }   /* the pill shows the focus ring */

  button { font: inherit; }
  .attach {
    display: grid; place-items: center; flex: none; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; color: var(--soft);
  }
  .attach svg { width: 19px; height: 19px; }
  #file:focus-visible + .attach { outline: 2px solid var(--ink); outline-offset: 2px; }
  /* the send button: liquid glass like the attach button, a touch brighter as the main action; arrow, or a spinner while busy */
  .go {
    display: grid; place-items: center; flex: none; width: 48px; height: 48px; padding: 0; border: 0; border-radius: 50%;
    background-color: rgba(255, 255, 255, 0.12); color: var(--ink); cursor: pointer;
    background-image: linear-gradient(160deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0) 60%);   /* the glass sheen, in both states */
    transition: transform 0.25s, background-color 0.35s, box-shadow 0.35s, color 0.35s;
  }
  /* ready to send (a link typed or a file attached): warm amber glass, the colour of the sparkles, still see-through */
  .search.ready .go { background-color: rgba(240, 158, 72, 0.36); color: #fff8ee; box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.18), 0 0 20px rgba(255, 160, 70, 0.45); }
  .go svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .go[disabled] { cursor: progress; background-color: rgba(255, 255, 255, 0.06); }
  .search.ready .go[disabled] { background-color: rgba(240, 158, 72, 0.22); }   /* still amber while it works, a little dimmer */
  .go[disabled] svg { display: none; }
  .go[disabled]::after { content: ""; width: 18px; height: 18px; border: 2px solid rgba(255, 255, 255, 0.25); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(1turn); } }

  .attached { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; width: 100%; text-shadow: none; }
  .attached > * { margin-top: 14px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; min-width: 0; max-width: 100%; padding: 4px 4px 4px 14px;
    border-radius: 999px; color: var(--ink); font-size: 0.9rem; background-color: rgba(0, 0, 0, 0.45);   /* smoked: it sits over the glowing stream */
  }
  .chip > span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip-x { display: inline-grid; place-items: center; width: 30px; height: 30px; padding: 0; border: 0; border-radius: 50%; background: none; color: var(--soft); font-size: 1.1rem; line-height: 1; cursor: pointer; }
  .share { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; font-size: 0.88rem; color: var(--ink); cursor: pointer;
          background: rgba(0, 0, 0, 0.45); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  .share input { width: 16px; height: 16px; margin: 0; accent-color: #fff; }

  /* the reference's secondary buttons (Login, Manifesto): glass pills with white text */
  .button, .ghost {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px; flex: none;
    padding: 12px 28px; border: 0; border-radius: 999px; cursor: pointer; text-decoration: none;
    color: var(--ink); font-family: var(--sans); font-size: 0.9rem; font-weight: 500; transition: background 0.2s;
  }

  .go:active { transform: scale(0.95); }
  /* hover looks only where there is a real pointer; on touch screens they stick after a tap */
  @media (hover: hover) {
    .go:not([disabled]):hover { transform: scale(1.05); background-color: rgba(255, 255, 255, 0.2); }
    .search.ready .go:not([disabled]):hover { background-color: rgba(248, 170, 90, 0.48); }
    .button:hover, .ghost:hover, .attach:hover, .chip-x:hover { background-color: rgba(255, 255, 255, 0.06); color: var(--ink); }
    .brand:hover { background: rgba(255, 255, 255, 0.06); }
    .button:hover .arrow, .ghost:hover .arrow { transform: translateX(3px); }
  }
  .arrow { transition: transform 0.2s; }
  .go, .button, .ghost, .attach, .chip-x, .share, .brand { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  .caption {
    margin: clamp(18px, 3.4vh, 32px) 0 0; min-height: 1.4em; max-width: 34rem;
    font-size: 0.9rem; line-height: 1.6; color: var(--soft);
    font-variant-numeric: tabular-nums;   /* the upload timer and percentage don't jitter */
  }
  .caption.error { font-size: 1rem; color: var(--warn); }
  /* the line sits over the glowing stream, so it gets smoked glass whenever it says something */
  .caption:not(:empty) { padding: 0.4em 1em; border-radius: 999px; background: rgba(0, 0, 0, 0.65); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); text-shadow: none; }

  .result { width: 100%; margin-top: 28px; border-radius: 24px; text-align: left; text-shadow: none; background-color: var(--panel); }
  .result video, .result img { display: block; width: 100%; max-height: 62vh; background: #050507; object-fit: contain; }
  .meta { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 20px 20px 20px 24px; flex-wrap: wrap; }
  .meta h2 { margin: 0; font-size: 1.1rem; font-weight: 500; overflow-wrap: anywhere; }
  .meta p { margin: 8px 0 0; font-size: 0.76rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .meta .ok { color: #a6dcbc; }
  .meta .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .meta .link-line { margin: 10px 0 0; font-family: var(--sans); font-size: 0.95rem; letter-spacing: 0; text-transform: none; overflow-wrap: anywhere; }
  .link-line a { color: var(--ink); text-underline-offset: 3px; }

  [hidden] { display: none !important; }

  @media (max-width: 600px) {
    .meta .actions, .meta .button, .ghost { width: 100%; }
  }
  /* touch screens: every control at least 44px */
  @media (pointer: coarse) {
    .brand { padding-block: 13px; margin-block: -13px; }
    .button, .ghost { min-height: 46px; }
    .chip { min-height: 44px; }
    .chip-x { width: 44px; height: 44px; }
    .share { min-height: 44px; }
    .share input { width: 20px; height: 20px; }
  }
  /* short screens (landscape phones, small laptops): less padding so the pill stays on the first screen */
  @media (max-height: 700px) {
    .top { padding-top: 14px; padding-bottom: 14px; }
    .hero { padding-top: 64px; padding-bottom: 72px; }
    .search { margin-top: 16px; }
  }
  @media (max-height: 480px) {
    .top { padding-top: 6px; padding-bottom: 6px; }
    .hero { padding-top: 44px; padding-bottom: 20px; }
    .caption { margin-top: 10px; }
  }
  /* big monitors: scale the whole page up instead of leaving a small island in the middle */
  @media (min-width: 1800px) and (min-height: 1000px) {
    html { font-size: 112.5%; }
  }
  @media (min-width: 2400px) and (min-height: 1300px) {
    html { font-size: 131.25%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .stack > * { animation: none; }
    * { transition: none !important; }
    .go[disabled]::after { animation-duration: 2.4s; }   /* still shows it is working, without spinning fast */
    .backdrop video { opacity: 1; }   /* the clip is not played: its first frame stands in as a still */
  }
  @media (forced-colors: active) {
    .liquid-glass, .search, .caption:not(:empty), .share { border: 1px solid CanvasText; }
    .liquid-glass::before { display: none; }
    .go[disabled]::after { border-color: CanvasText; border-top-color: Highlight; }
  }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/" translate="no">
    <svg class="mark" viewBox="130 141 1000 1000" aria-hidden="true" focusable="false">
      <path fill="#ffffff" d="M588 143H1094L817 437H690L206 832C178 856 158 893 161 962C148 940 142 912 142 880V608C142 560 160 515 200 483Z"/>
      <path fill="#b4c6d6" d="M398 724L538 888H1120L932 1140H388C352 1140 320 1128 296 1106L212 1028C168 988 172 902 232 860Z"/>
    </svg>
    <span>Cellulo</span>
  </a>
</header>

<!-- decoration only: muted, looping, no controls; app.js starts it unless the visitor prefers reduced motion -->
<div class="backdrop" aria-hidden="true">
  <video id="bg" src="hero.mp4" muted loop playsinline preload="auto" disablepictureinpicture disableremoteplayback tabindex="-1"></video>
</div>

<main class="hero">
  <div class="stack">
    <h1 style="--i:0">Your file. <em>One link</em> away.</h1>
    <form class="search liquid-glass" id="form" style="--i:2">
      <!-- a label for the file input opens the system file picker natively; a scripted click on a hidden input does not in every browser -->
      <input id="file" type="file" class="sr-only">
      <label class="attach liquid-glass" id="pick" for="file" title="Attach a file">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20.5 11.6 12.3 19.8a5.2 5.2 0 0 1-7.4-7.4l8.6-8.6a3.5 3.5 0 0 1 4.9 4.9l-8.6 8.6a1.7 1.7 0 0 1-2.5-2.5l7.8-7.8"/>
        </svg>
        <span class="sr-only">Attach a file</span>
      </label>
      <label class="sr-only" for="link">File link</label>
      <input id="link" name="link" type="text" inputmode="url" autocomplete="off" spellcheck="false" placeholder="Paste your file link here&hellip;">
      <button class="go liquid-glass" id="go" type="submit">
        <span class="sr-only" id="go-label">Upload</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
    <div class="attached" style="--i:2">
      <span class="chip liquid-glass" id="chip" hidden>
        <span id="chip-name"></span>
        <button type="button" class="chip-x" id="unpick" aria-label="Remove the attached file">&times;</button>
      </span>
      <label class="share" id="share-row" hidden><input type="checkbox" id="share" checked> Anyone with the link can restore it</label>
    </div>
    <!-- empty until there is progress or an error to report; keeps its line so the pill doesn't jump -->
    <p class="caption" id="status" role="status" style="--i:3"></p>
    <section class="result liquid-glass" id="sent" aria-label="Uploaded file" hidden>
      <div class="meta">
        <div>
          <h2 id="sent-name"></h2>
          <p id="sent-facts"></p>
          <p class="link-line"><a id="sent-link" target="_blank" rel="noopener"></a></p>
        </div>
        <div class="actions">
          <button type="button" class="button liquid-glass" id="copy">Copy link</button>
          <button type="button" class="ghost liquid-glass" id="try">Restore it <span class="arrow" aria-hidden="true">&rarr;</span></button>
        </div>
      </div>
    </section>
    <section class="result liquid-glass" id="result" aria-label="Restored file" hidden>
      <div id="media"></div>
      <div class="meta">
        <div>
          <h2 id="name"></h2>
          <p id="facts"></p>
        </div>
        <a class="button liquid-glass" id="save">Download <span class="arrow" aria-hidden="true">&darr;</span></a>
      </div>
    </section>
  </div>
</main>


<script src="app.js"></script>
</body>
</html>
